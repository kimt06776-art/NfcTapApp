<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-Platform Home</title>
    <linkcdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #4A90E2; /* 신뢰와 평안의 블루 */
            --accent-color: #FFD700; /* 영광/보상의 골드 */
            --bg-color: #F4F6F9;
            --text-dark: #333333;
            --text-gray: #888888;
            --card-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 모바일 프레임 시뮬레이션 */
        .mobile-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            background-color: #ffffff;
            position: relative;
            overflow-y: auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        /* 상단 헤더 */
        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .user-greeting h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .user-greeting span {
            font-size: 0.9rem;
            color: var(--primary-color);
            font-weight: 500;
        }

        .header-icons i {
            font-size: 1.2rem;
            color: var(--text-dark);
            margin-left: 15px;
            cursor: pointer;
        }

        /* 메인 콘텐츠 영역 */
        main {
            padding: 0 20px 80px 20px; /* Bottom Nav 공간 확보 */
            flex: 1;
        }

        /* 1. NFC 안내 섹션 (Zero-Click 강조) */
        .nfc-section {
            background: linear-gradient(135deg, #4A90E2, #6aa5e8);
            border-radius: 20px;
            padding: 25px;
            color: white;
            text-align: center;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(74, 144, 226, 0.3);
        }

        .nfc-icon-wrapper {
            width: 70px;
            height: 70px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px auto;
            position: relative;
        }

        /* 맥박 애니메이션 (터치 유도) */
        .nfc-icon-wrapper::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        .nfc-icon-wrapper i {
            font-size: 1.8rem;
        }

        .nfc-text h2 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .nfc-text p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        /* 2. 게이미피케이션 (신앙 활동) */
        .gamification-card {
            background: white;
            border-radius: 15px;
            padding: 15px 20px;
            margin-bottom: 25px;
            border: 1px solid #eee;
            box-shadow: var(--card-shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .level-info h3 {
            font-size: 0.9rem;
            color: var(--text-gray);
            margin-bottom: 5px;
        }

        .level-info .points {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .level-info .points span {
            color: var(--primary-color);
        }

        .badge-icon {
            text-align: center;
        }
        
        .badge-icon i {
            color: var(--accent-color);
            font-size: 1.5rem;
            margin-bottom: 3px;
        }
        
        .badge-icon div {
            font-size: 0.7rem;
            color: var(--text-gray);
        }

        /* 3. AI 오늘의 추천 (핵심 콘텐츠) */
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        
        .section-title i {
            color: var(--primary-color);
            margin-right: 8px;
            font-size: 0.9rem;
        }

        .ai-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            margin-bottom: 25px;
            border-left: 4px solid var(--primary-color);
        }

        .ai-tag {
            display: inline-block;
            background: #EAF4FF;
            color: var(--primary-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .ai-content h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .ai-content p {
            font-size: 0.9rem;
            color: var(--text-gray);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 4. 퀵 메뉴 그리드 */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .menu-item {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: var(--card-shadow);
            transition: transform 0.2s;
            cursor: pointer;
        }

        .menu-item:active {
            transform: scale(0.98);
        }

        .menu-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 10px auto;
        }

        .menu-icon i {
            font-size: 1.5rem;
        }

        .menu-item span {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-dark);
        }

        /* 색상 변형 */
        .c-purple { color: #8e44ad; background: #f4ecf7; }
        .c-green { color: #27ae60; background: #e9f7ef; }
        .c-orange { color: #d35400; background: #fbeee6; }
        .c-blue { color: #2980b9; background: #ebf5fb; }

        /* 하단 네비게이션 */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: white;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #eee;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.03);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #999;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .nav-item i {
            font-size: 1.4rem;
            margin-bottom: 4px;
        }

        .nav-item.active {
            color: var(--primary-color);
        }

    </style>
</head>
<body>

    <div class="mobile-container">
        <header>
            <div class="user-greeting">
                <h1>샬롬, 김성도님</h1>
                <span>오늘도 주님과 동행하세요</span>
            </div>
            <div class="header-icons">
                <i class="fa-regular fa-bell"></i>
                <i class="fa-solid fa-bars"></i>
            </div>
        </header>

        <main>
            <section class="nfc-section" onclick="alert('액세서리에 태깅하면 말씀이 자동 실행됩니다!')">
                <div class="nfc-icon-wrapper">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                </div>
                <div class="nfc-text">
                    <h2>스마트 액세서리 터치</h2>
                    <p>휴대폰 뒷면에 태깅하여<br>오늘의 말씀을 바로 들어보세요</p>
                </div>
            </section>

            <section class="gamification-card">
                <div class="level-info">
                    <h3>현재 나의 영적 여정</h3>
                    <div class="points">
                        <span>1,240</span> Pts <small>(Lv.3 겨자씨)</small>
                    </div>
                </div>
                <div class="badge-icon">
                    <i class="fa-solid fa-medal"></i>
                    <div>새벽기도왕</div>
                </div>
            </section>

            <div class="section-title">
                <i class="fa-solid fa-robot"></i> AI 맞춤 추천
            </div>
            <section class="ai-card" onclick="alert('AI가 분석한 김성도님을 위한 시편 23편 설교가 재생됩니다.')">
                <span class="ai-tag">김성도님을 위한 위로의 말씀</span>
                <div class="ai-content">
                    <h3>여호와는 나의 목자시니...</h3>
                    <p>최근 묵상하신 '평안' 주제와 연관된 이찬수 목사님의 주일 설교 하이라이트입니다.</p>
                </div>
            </section>

            <div class="section-title">
                <i class="fa-solid fa-grid-2"></i> 신앙 활동
            </div>
            <section class="menu-grid">
                <div class="menu-item" onclick="alert('전 세계 성도들과 기도제목을 나누세요.')">
                    <div class="menu-icon c-purple">
                        <i class="fa-solid fa-earth-americas"></i>
                    </div>
                    <span>글로벌 커뮤니티</span>
                </div>
                <div class="menu-item" onclick="alert('성경 읽기 모드로 진입합니다.')">
                    <div class="menu-icon c-green">
                        <i class="fa-solid fa-book-bible"></i>
                    </div>
                    <span>성경 통독</span>
                </div>
                <div class="menu-item" onclick="alert('은혜로운 찬양이 재생됩니다.')">
                    <div class="menu-icon c-orange">
                        <i class="fa-solid fa-music"></i>
                    </div>
                    <span>CCM 찬양</span>
                </div>
                <div class="menu-item" onclick="alert('이번주 주보와 소식을 확인합니다.')">
                    <div class="menu-icon c-blue">
                        <i class="fa-regular fa-newspaper"></i>
                    </div>
                    <span>주보 / 공지</span>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <div class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span>홈</span>
            </div>
            <div class="nav-item">
                <i class="fa-solid fa-church"></i>
                <span>예배</span>
            </div>
            <div class="nav-item">
                <i class="fa-solid fa-hands-praying"></i>
                <span>기도</span>
            </div>
            <div class="nav-item">
                <i class="fa-solid fa-user"></i>
                <span>마이페이지</span>
            </div>
        </nav>
    </div>

</body>
</html>
